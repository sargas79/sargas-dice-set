name: Release

# Publish a release by pushing a tag (git tag v0.1.0 && git push origin v0.1.0)
# or by running this workflow manually with a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Stamp the manifest
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ steps.version.outputs.tag }}"
          jq --arg v "${{ steps.version.outputs.version }}" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             '.version = $v | .download = $d | .manifest = $m' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Package
        run: zip -r module.zip module.json dist/sargas-dice-set.js styles templates lang LICENSE README.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sargas Dice Set ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            module.zip
            module.json
