/* ---------- polyhedra (ported from sargas-dice-set src/engine/polyhedra.js) ---------- */

const MM = 0.0125; // world units → metres (d20 ≈ 22 mm across)

    let n = v3.cross(v3.sub(verts[j], verts[i]), v3.sub(verts[k], verts[i]));
    if (v3.len(n) < 1e-9) continue;

const polyCache = {};

  const vertices = raw.map(v => v3.scale(v, RADIUS[kind] * MM / maxR));

/* ---------- atlas layout ---------- */
const CELL = 192;

    const col = cell % cols, row = Math.floor(cell / cols);
    const u = (col + 0.5 + x / ext * 0.47) / cols, py = (row + 0.5 - y / ext * 0.47) / rows;
    return [u, 1 - py];

/* ---------- chamfered geometry (ported from src/engine/geometry.js) ---------- */
const geoCache = {};

    const mid = v3.scale(v3.add(v3.add(a.p, b.p), c.p), 1/3); if (v3.dot(n, mid) < 0) [b, c] = [c, b]; push(a); push(b); push(c); };

    const centre = { p: f.center, n: f.normal, uv: L.toUV(fi, 0, 0) };
    const ring = f.verts.map((vi, j) => ({ p: shrunk[fi].get(vi), n: f.normal, uv: L.toUV(fi, f.pts[j][0]*k, f.pts[j][1]*k) }));
    for (let j = 0; j < ring.length; j++) tri(centre, ring[j], ring[(j+1) % ring.length]);

    const b = f.verts[(j+1) % f.verts.length], key = a < b ? a+'-'+b : b+'-'+a;
    if (seen.has(key)) return; seen.add(key);

    const mk = (face, idx, vi) => ({ p: shrunk[idx].get(vi), n: face.normal, uv: bodyUV });
    const fa = mk(f, fi, a), fb = mk(f, fi, b), ga = mk(g, gi, a), gb = mk(g, gi, b);
    tri(fa, fb, gb); tri(fa, gb, ga);
  }));

    const axis = v3.norm(v);
    const around = poly.faces.map((f, fi) => f.verts.includes(vi) ? { p: shrunk[fi].get(vi), n: f.normal, uv: bodyUV } : null).filter(Boolean);
    const r1 = v3.norm(v3.sub(around[0].p, v3.scale(axis, v3.dot(around[0].p, axis)))), r2 = v3.cross(axis, r1);
    const ang = p => Math.atan2(v3.dot(p, r2), v3.dot(p, r1));
    around.sort((a, b) => ang(a.p) - ang(b.p));
    const c = { p: v3.scale(around.reduce((s, x) => v3.add(s, x.p), [0,0,0]), 1/around.length), n: axis, uv: bodyUV };

/* ---------- dragon mark: user-supplied silhouette, luminance → alpha, tinted per set ---------- */
const dragonImg = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'assets/dragon-mark.png'; });
const dragonMask = (() => {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d');
  const k = dragonImg.naturalWidth / 980; // crop tuned to the 980px source
  x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
  x.drawImage(dragonImg, 195 * k, 195 * k, 590 * k, 590 * k, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S);
  for (let i = 0; i < d.data.length; i += 4) { const a = 255 - (d.data[i] + d.data[i+1] + d.data[i+2]) / 3; d.data[i] = d.data[i+1] = d.data[i+2] = 255; d.data[i+3] = a < 40 ? 0 : a; }
  x.putImageData(d, 0, 0); return c;
})();
const tintCache = {};

  x.drawImage(dragonMask, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return (tintCache[color] = c);

/* ---------- symbols (drawn in a unit box, radius 1) ---------- */
function symbolPath(ctx, sym) {
  const p = new Path2D();
  if (sym === 'dragon') {
    p.moveTo(-.72,.95); p.bezierCurveTo(-.86,.3,-.74,-.12,-.5,-.3);
    p.quadraticCurveTo(-.82,-.6,-1,-1); p.quadraticCurveTo(-.55,-.72,-.34,-.44);
    p.quadraticCurveTo(-.34,-.8,-.18,-1.02); p.quadraticCurveTo(-.08,-.7,-.1,-.48);
    p.lineTo(.14,-.5); p.lineTo(.28,-.68); p.lineTo(.36,-.44);
    p.quadraticCurveTo(.7,-.4,.92,-.3); p.lineTo(1,-.18); p.lineTo(.93,-.08);
    p.lineTo(.85,-.08); p.lineTo(.8,.06); p.lineTo(.73,-.06); p.lineTo(.6,-.04); p.lineTo(.55,.08); p.lineTo(.49,-.02);
    p.lineTo(.1,.06);

    p.quadraticCurveTo(.72,.46,.4,.46); p.lineTo(.12,.47); p.lineTo(.06,.66); p.lineTo(-.06,.52);

        c.save(); c.rotate(a);
        c.fillStyle = set.edge; c.save(); c.scale(1.08, 1.04); drawAxe(c, f); c.restore();
        c.fillStyle = set.ink; drawAxe(c, f); c.restore();

    } else if (set.sym === 'shield') {

      c.fillStyle = set.body; c.fillRect(-.09,-.55,.18,1.18); c.fillRect(-.45,-.25,.9,.18);
    } else if (set.sym === 'waves') {

      for (let i = 0; i < 3; i++) {

}

/* ---------- painting ---------- */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function paintBody(ctx, W, H, set, seed) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, set.body); g.addColorStop(.5, set.body2); g.addColorStop(1, set.body);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = rng(seed);
  ctx.lineCap = 'round';
  for (let s = 0; s < Math.ceil(W * H / 20000); s++) { // faint log-spiral streaks — the "Spiral" in Spiral Set
    const cx = r() * W, cy = r() * H, a0 = r() * Math.PI * 2, dir = r() < .5 ? 1 : -1, size = 20 + r() * 70;
    ctx.strokeStyle = set.swirl; ctx.globalAlpha = set.id === 'wroan' ? .16 + r() * .2 : .07 + r() * .1;
    ctx.lineWidth = .6 + r() * 2.4; ctx.beginPath();
    for (let t = 0; t < 14; t += .12) { const rad = size * Math.exp(-.18 * t), a = a0 + dir * t;
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad; t ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

}
function text(ctx, set, s, x, y, px, rot, dotted) {

  ctx.font = `700 ${px}px "Cormorant SC", serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = set.edge; ctx.lineWidth = px * .1; ctx.strokeText(s, 0, px * .04);

}
const SIZE = { 4: .2, 6: .46, 8: .3, 10: .3, 100: .22, 12: .34, 20: .27 };
function label(kind, v) {
  if (kind === 10) return String(v % 10);
  if (kind === 100) return String((v % 10) * 10).padStart(2, '0');
  return String(v);
}
function paintAtlas(set, kind, poly, L) {
  const mk = () => { const c = document.createElement('canvas'); c.width = L.W; c.height = L.H; return c; };
  const color = mk(), cx = color.getContext('2d');
  paintBody(cx, L.W, L.H, set, kind * 97 + set.id.length * 13);
  let glow = null, gx = null;
  if (set.glow) { glow = mk(); gx = glow.getContext('2d'); gx.fillStyle = '#000'; gx.fillRect(0, 0, L.W, L.H); }
  const bodyOnly = cx.getImageData(0, 0, L.W, L.H).data;
  const max = kind === 100 ? 10 : kind, px = CELL * SIZE[kind];
  poly.faces.forEach((f, fi) => {
    const [ox, oy] = L.toPx(fi, 0, 0);
    if (kind === 4) {
      f.verts.forEach((vi, j) => {
        const [vx, vy] = L.toPx(fi, f.pts[j][0], f.pts[j][1]);
        const dx = vx - ox, dy = vy - oy, rot = Math.atan2(dx, -dy);
        const x = ox + dx * .56, y = oy + dy * .56, v = poly.vertexValues[vi];
        if (v === 4) drawSymbol(cx, set, x, y, px * .55, rot, gx); else text(cx, set, String(v), x, y, px, rot);
      });
      return;
    }
    if (f.value === max) { drawSymbol(cx, set, ox, oy, px * (kind === 6 ? .55 : kind === 100 ? .7 : .6), 0, gx); return; }
    const s = label(kind, f.value);
    const dotted = (s === '6' || s === '9') && kind !== 6 && kind !== 8;
    const shift = kind === 10 || kind === 100 ? -px * .12 : 0;
    text(cx, set, s, ox, oy + shift, px, 0, dotted);
  });
  // Alpha mask: glass body see-through, painted ink stays solid.
  const bodyAlpha = set.id === 'wroan' ? 200 : 125;
  const mask = mk(), mx = mask.getContext('2d'), img = cx.getImageData(0, 0, L.W, L.H), out = mx.createImageData(L.W, L.H);
  for (let i = 0; i < img.data.length; i += 4) {
    const d = Math.abs(img.data[i] - bodyOnly[i]) + Math.abs(img.data[i+1] - bodyOnly[i+1]) + Math.abs(img.data[i+2] - bodyOnly[i+2]);
    const t = d > 24 ? 255 : bodyAlpha;

  bx.putImageData(bo, 0, 0); bx.filter = 'blur(1px)'; bx.drawImage(bump, 0, 0);
  // darken ink slightly so the engraving reads as cut into the glass

/* ---------- dice ---------- */
const SILVER = new THREE.MeshPhysicalMaterial({ name: 'silver_inlay', color: '#dfe3e8', metalness: 1, roughness: 0.22, clearcoat: .4, envMapIntensity: 1.4 });
const KINDS = [4, 6, 8, 20, 10, 100, 12];
function buildDie(set, kind) {
  const pk = kind === 100 ? 10 : kind, poly = getPoly(pk), L = layoutFor(poly), geo = getGeometry(poly, L);
  const { color, glow, mask, bump } = paintAtlas(set, kind, poly, L);
  const tex = (c, srgb) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
  const mat = new THREE.MeshPhysicalMaterial({
    name: `${set.id}_d${kind}_metal`, map: tex(color, true), roughness: 0.3, metalness: 1, metalnessMap: tex(bump, false),
    bumpMap: tex(bump, false), bumpScale: 3,
    clearcoat: 0.5, clearcoatRoughness: 0.15, envMapIntensity: 1.3,
  });
  if (glow) { mat.emissive = new THREE.Color('#ffffff'); mat.emissiveMap = tex(glow, true); mat.emissiveIntensity = 1.4; }
  const mesh = new THREE.Mesh(geo, [mat, SILVER]);
  mesh.name = `${set.id}_d${kind}`;
  // Orient: highest value (symbol) up, reading upright from the front.
  const V = a => new THREE.Vector3(...a);
  let topDir, readUp;
  const maxV = kind === 100 ? 10 : kind;
  if (pk === 4) {
    const vi = poly.vertexValues.indexOf(4), f = poly.faces.find(f => f.verts.includes(vi));
    topDir = V(v3.norm(poly.vertices[vi])); readUp = V(f.normal).multiplyScalar(-1);
  } else {
    const f = poly.faces.find(f => f.value === maxV); topDir = V(f.normal); readUp = V(f.up);
  }
  const q = new THREE.Quaternion().setFromUnitVectors(topDir, new THREE.Vector3(0, 1, 0));
  const h = readUp.applyQuaternion(q); h.y = 0;
  if (h.lengthSq() > 1e-8) {
    h.normalize(); const ang = Math.atan2(h.x, h.z) - Math.atan2(0, -1);
    q.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -ang));
  }
  mesh.quaternion.copy(q);
  const holder = new THREE.Group(); holder.name = `${set.id}_d${kind}_holder`; holder.add(mesh);
  holder.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(mesh); mesh.position.y = -box.min.y;
  return holder;
}
function buildSet(set, z = 0) {
  const g = new THREE.Group(); g.name = `spiral_${set.id}`;
  const P = { 4: [-.045, -.02], 6: [-.015, -.024], 8: [.015, -.024], 12: [.046, -.02], 10: [-.031, .012], 20: [0, .016], 100: [.031, .012] };
  KINDS.forEach(k => { const d = buildDie(set, k); d.position.set(P[k][0], 0, z + P[k][1]); g.add(d); });
  return g;
}

/* ---------- studio environment so glass has something to refract/reflect ---------- */
{
  const env = new THREE.Scene();
  env.background = new THREE.Color('#2a2c33');
  const panel = (w, h, pos, look, c, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(i), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(...look); env.add(m); };
  panel(6, 3, [0, 5, 0], [0, 0, 0], '#ffffff', 3);
  panel(3, 4, [5, 1.5, 2], [0, 0, 0], '#fff4e6', 2.2);
  panel(3, 4, [-5, 1.5, -1], [0, 0, 0], '#e6f0ff', 1.4);
  panel(8, 1, [0, 0.5, -5], [0, 0, 0], '#ffffff', 0.8);
  const pmrem = new THREE.PMREMGenerator(stage._renderer);
  stage._scene.environment = pmrem.fromScene(env, 0.03).texture;
}

/* ---------- UI ---------- */
const cache = {};
const tabs = document.getElementById('tabs'), sub = document.getElementById('sub');
const OPTIONS = [...SETS, { id: 'all', name: 'Full set', desc: 'All five characters · 35 dice', dot: 'conic-gradient(#1f6bff,#8a2be2,#e8531a,#f4f4f0,#1497c0,#1f6bff)' }];
function show(id) {
  const opt = OPTIONS.find(o => o.id === id) || OPTIONS[0];
  localStorage.setItem('spiral-set-view', opt.id);
  [...tabs.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.id === opt.id));
  sub.textContent = opt.desc;
  stage.setAttribute('name', 'spiral_set_' + opt.id);
  if (!cache[opt.id]) {
    if (opt.id === 'all') { const g = new THREE.Group(); g.name = 'spiral_set';
      SETS.forEach((s, i) => { const sg = buildSet(s); sg.position.set(i < 3 ? (i - 1) * 0.12 : (i - 3.5) * 0.12, 0, i < 3 ? -0.045 : 0.045); g.add(sg); }); cache.all = g; }
    else cache[opt.id] = buildSet(opt);
  }
  stage.setObject(cache[opt.id]);
}
OPTIONS.forEach(o => {
  const b = document.createElement('button'); b.className = 'tab'; b.dataset.id = o.id;
  b.innerHTML = `<span class="dot" style="background:${o.dot}"></span>${o.name}`;
  b.onclick = () => show(o.id); tabs.appendChild(b);
});
show(localStorage.getItem('spiral-set-view') || 'lana');
